<title>Загрузка ЕВА</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Демо анимации загрузки: большой экран старта и примеры, где загрузка встречается в приложении. Тёмная тема Лаборатории — одна. */
:root{--bg:#1A1A1A;--panel:#262626;--node:#2B2B2B;--line:#3D3D3D;--text:#F3F3F3;--text-2:#A8A8A8;--lime:#C6FF34;--blue:#0179FE;--font-ui:'Exo 2','Bender',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--font-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto;padding-block:32px 64px;display:grid;gap:28px}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:56px 44px;background:#151515;border-radius:16px}
.word{font:500 13px/1 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--text-2)}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:500 13px/1 var(--font-ui);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
button[aria-pressed="true"]{border-color:var(--lime);color:var(--lime)}
button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h2{font:500 13px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);margin:0 0 12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--panel);border-radius:12px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card p{margin:0;color:var(--text-2);font-size:13px}
.overlay-box{position:relative;height:200px;border-radius:10px;background:#1E1E1E;overflow:hidden;display:flex;align-items:center;justify-content:center}
.overlay-box::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#333 1px,transparent 1px);background-size:16px 16px;opacity:.6}
.overlay-box .eva-loader{position:relative}
.node{background:var(--node);border:1px solid #444;border-radius:10px;overflow:hidden}
.node .h{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--blue);font-weight:500}
.node .b{padding:10px;font-size:12px;color:var(--text-2)}
.runrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#1E1E1E;border-radius:8px;font:500 13px 'JetBrains Mono',monospace}
/* Анимация загрузки ЕВА.
   Цикл 2,8 с: буквы-грани разлетаются от центра → весь куб делает оборот по часовой, грани по спирали возвращаются →
   щелчок сборки: вспышка, кольцо, лаймовые плашки разлетаются и уменьшаются до нуля → короткая пауза → повтор.
   Анимируются только transform и opacity. При prefers-reduced-motion — статичный логотип с мягкой пульсацией. */

.eva-loader {
  --eva-size: 160px;
  --eva-cycle: 2.8s;
  --eva-lime: #C6FF34;
  --eva-blue: #0179FE;
  --eva-text: #F3F3F3;
  --eva-text-2: #A8A8A8;
  --eva-track: #3D3D3D;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.eva-loader__stage {
  position: relative;
  width: var(--eva-size);
  height: var(--eva-size);
}

.eva-loader__stage svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.eva-loader__face { fill: var(--eva-lime); }
.eva-loader__glow { fill: var(--eva-lime); opacity: 0; }
.eva-loader__ring { fill: none; stroke: var(--eva-lime); stroke-width: 3; opacity: 0; }
.eva-loader__bit { fill: var(--eva-lime); opacity: 0; }
.eva-loader__bit--blue { fill: var(--eva-blue); }

.eva-loader__label {
  font: 500 14px/1.3 var(--font-ui, 'Bender', system-ui, sans-serif);
  color: var(--eva-text-2);
  text-align: center;
  min-height: 1.3em;
}

.eva-loader__bar {
  width: calc(var(--eva-size) * 1.4);
  height: 3px;
  border-radius: 2px;
  background: var(--eva-track);
  overflow: hidden;
}
.eva-loader__bar > i {
  display: block;
  height: 100%;
  width: 100%;
  background: var(--eva-lime);
  transform-origin: left center;
  transform: scaleX(var(--eva-progress, 0));
  transition: transform .25s ease-out;
}
.eva-loader__bar--indeterminate > i {
  width: 35%;
  transform: none;
}

/* Размеры */
.eva-loader--splash { --eva-size: 180px; }
.eva-loader--overlay { --eva-size: 96px; gap: 10px; }
.eva-loader--inline { --eva-size: 24px; flex-direction: row; gap: 8px; }
.eva-loader--inline .eva-loader__label { font-size: 12px; }

@media (prefers-reduced-motion: no-preference) {
  /* Весь куб вращается вокруг центра */
  .eva-loader:not(.eva-loader--inline) .eva-loader__spin {
    animation: eva-spin var(--eva-cycle) infinite;
  }
  /* Каждая грань улетает вдоль своей стороны и возвращается по спирали */
  .eva-loader:not(.eva-loader--inline) .eva-loader__fly {
    animation: eva-fly var(--eva-cycle) infinite;
  }
  .eva-loader:not(.eva-loader--inline) .eva-loader__glow {
    animation: eva-glow var(--eva-cycle) infinite;
  }
  .eva-loader:not(.eva-loader--inline) .eva-loader__ring {
    animation: eva-ring var(--eva-cycle) infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .eva-loader:not(.eva-loader--inline) .eva-loader__bit {
    animation: eva-bit var(--eva-cycle) infinite;
  }
  /* Маленькая версия: грани по очереди по часовой загораются */
  .eva-loader--inline .eva-loader__fly {
    animation: eva-pulse 1.2s ease-in-out infinite;
  }
  .eva-loader--inline .eva-loader__fly--right { animation-delay: .4s; }
  .eva-loader--inline .eva-loader__fly--left { animation-delay: .8s; }

  .eva-loader__bar--indeterminate > i { animation: eva-bar 1.4s ease-in-out infinite; }
}

@media (prefers-reduced-motion: reduce) {
  .eva-loader__spin { animation: eva-breathe 2.4s ease-in-out infinite; }
}

@keyframes eva-spin {
  0%, 20% { transform: rotate(0deg); animation-timing-function: cubic-bezier(.55, 0, .35, 1); }
  72%, 100% { transform: rotate(360deg); }
}

@keyframes eva-fly {
  0%, 6% { transform: translate(0, 0); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
  20% { transform: translate(calc(var(--dx) * 46px), calc(var(--dy) * 46px)); }
  46% { transform: translate(calc(var(--dx) * 46px), calc(var(--dy) * 46px)); animation-timing-function: cubic-bezier(.6, 0, .9, .6); }
  72% { transform: translate(calc(var(--dx) * -5px), calc(var(--dy) * -5px)); animation-timing-function: ease-out; }
  80%, 100% { transform: translate(0, 0); }
}

@keyframes eva-glow {
  0%, 70% { opacity: 0; }
  75% { opacity: .85; }
  95%, 100% { opacity: 0; }
}

@keyframes eva-ring {
  0%, 71% { opacity: 0; transform: scale(.55); }
  74% { opacity: .9; }
  94%, 100% { opacity: 0; transform: scale(1.45); }
}

@keyframes eva-bit {
  0%, 71% { opacity: 0; transform: rotate(var(--a)) translateX(30px) rotate(45deg) scale(.4); }
  74% { opacity: 1; transform: rotate(var(--a)) translateX(60px) rotate(45deg) scale(1); animation-timing-function: cubic-bezier(.15, .8, .3, 1); }
  96% { opacity: .9; transform: rotate(var(--a)) translateX(var(--r)) rotate(calc(45deg + var(--spin))) scale(0); }
  100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--r)) scale(0); }
}

@keyframes eva-pulse {
  0%, 100% { opacity: .35; }
  30% { opacity: 1; }
}

@keyframes eva-breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: .7; }
}

@keyframes eva-bar {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(290%); }
}

</style>
<main class="wrap">
  <section class="splash" aria-label="Экран запуска">
    <div id="splash"></div>
    <div class="word">ЕВА.Ноды · Лаборатория</div>
    <div class="controls">
      <button type="button" id="slow" aria-pressed="false">Замедлить ×3</button>
      <button type="button" id="prog" aria-pressed="false">С процентами</button>
    </div>
  </section>

  <section>
    <h2>Где ещё появляется</h2>
    <div class="row">
      <div class="card">
        <div class="overlay-box" id="overlay"></div>
        <p>Поверх экрана: открытие проекта, загрузка модели или датасета.</p>
      </div>
      <div class="card">
        <div class="node"><div class="h"><span>Нарезка</span><span id="inline1"></span></div><div class="b">Считает… 6 из 14 рамок</div></div>
        <div class="runrow"><span>шлиф_018.jpg</span><span id="inline2"></span></div>
        <p>Маленькая версия: в шапке блока, пока он считает, и в строке Прогона. Грани по очереди загораются по часовой.</p>
      </div>
    </div>
  </section>
</main>

<script>
var FACES=[{"id": "top", "dx": 0, "dy": -1, "d": "M230.0 59.2 L192.8 65.5 L111.5 125.0 L111.5 125.8 L225.0 210.8 L227.2 210.2 L316.2 145.5 L324.0 118.8 L322.5 116.5 L294.8 97.0 L252.5 103.0 L252.8 99.8 L258.5 79.5Z M249.5 129.2 L261.5 137.8 L264.0 140.5 L241.0 156.8 L227.8 147.0 L226.8 145.5Z M205.5 97.5 L220.0 108.5 L198.5 124.2 L197.0 124.5 L183.2 114.0Z"}, {"id": "right", "dx": 0.866, "dy": 0.5, "d": "M344.5 136.5 L325.2 150.2 L231.5 222.0 L231.2 305.8 L232.0 347.2 L275.8 316.0 L275.8 300.5 L287.2 291.8 L298.5 284.2 L298.8 298.5 L299.5 299.0 L342.5 267.8Z M287.5 213.5 L298.8 252.5 L276.2 268.5 L275.8 267.2 L286.5 214.8Z"}, {"id": "left", "dx": -0.866, "dy": 0.5, "d": "M102.0 135.8 L101.0 264.0 L221.5 348.2 L221.5 317.5 L148.8 265.5 L148.8 250.5 L149.8 250.0 L197.5 283.2 L197.5 252.5 L149.2 217.8 L149.2 202.2 L150.5 201.8 L221.0 252.5 L221.8 252.2 L221.5 221.5Z"}];
var BITS=[[8,150,90],[38,182,-120],[66,140,160],[98,172,-90],[128,150,120],[158,186,-160],[190,145,90],[218,176,-120],[248,152,140],[278,184,-90],[308,146,120],[338,170,-140]];
var uid=0;
function loader(variant,label,bar){
  uid++;var inl=variant==='inline';var VB='-200 -200 400 400',SH='translate(-226 -210)';
  var s='<div class="eva-loader eva-loader--'+variant+'" role="status" aria-label="'+(label||'Загрузка')+'"><div class="eva-loader__stage" aria-hidden="true">';
  if(!inl){s+='<svg viewBox="'+VB+'"><defs><filter id="g'+uid+'" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter></defs><g class="eva-loader__glow" filter="url(#g'+uid+')">'+FACES.map(function(f){return '<path fill-rule="evenodd" transform="'+SH+'" d="'+f.d+'"/>'}).join('')+'</g></svg>';}
  s+='<svg viewBox="'+VB+'" class="eva-loader__spin">'+FACES.map(function(f){return '<g class="eva-loader__fly eva-loader__fly--'+f.id+'" style="--dx:'+f.dx+';--dy:'+f.dy+'"><path class="eva-loader__face" fill-rule="evenodd" transform="'+SH+'" d="'+f.d+'"/></g>'}).join('')+'</svg>';
  if(!inl){s+='<svg viewBox="'+VB+'"><circle class="eva-loader__ring" cx="0" cy="0" r="120"/>'+BITS.map(function(b,i){return '<rect class="eva-loader__bit'+(i%4===3?' eva-loader__bit--blue':'')+'" x="-9" y="-9" width="18" height="18" rx="3" style="--a:'+b[0]+'deg;--r:'+b[1]+'px;--spin:'+b[2]+'deg"/>'}).join('')+'</svg>';}
  s+='</div>';
  if(label)s+='<div class="eva-loader__label">'+label+'</div>';
  if(bar)s+='<div class="eva-loader__bar eva-loader__bar--indeterminate"><i></i></div>';
  return s+'</div>';
}
document.getElementById('splash').innerHTML=loader('splash','Будим нейроны…',true);
document.getElementById('overlay').innerHTML=loader('overlay','Открываем проект…',true);
document.getElementById('inline1').innerHTML=loader('inline');
document.getElementById('inline2').innerHTML=loader('inline','распознаём');

var LABELS=['Будим нейроны…','Подключаем видеокарту…','Загружаем шрифты…','Проверяем браузер…','Почти готово…'];
var li=0,lab=document.querySelector('#splash .eva-loader__label');
setInterval(function(){li=(li+1)%LABELS.length;lab.textContent=LABELS[li];},2800);

var root=document.querySelector('#splash .eva-loader');
document.getElementById('slow').addEventListener('click',function(){
  var on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);
  document.querySelectorAll('.eva-loader').forEach(function(el){el.style.setProperty('--eva-cycle',on?'8.4s':'2.8s');});
});
var pt=null;
document.getElementById('prog').addEventListener('click',function(){
  var on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);
  var bar=root.querySelector('.eva-loader__bar'),i=bar.firstElementChild;
  clearInterval(pt);
  if(on){bar.classList.remove('eva-loader__bar--indeterminate');var p=0;i.style.setProperty('--eva-progress',0);
    pt=setInterval(function(){p=p>=1?0:p+0.04;i.style.setProperty('--eva-progress',p);lab.textContent=p>=1?'Готово':'Загружаем датасет «Кириллица»… '+Math.round(p*100)+'%';},180);}
  else{bar.classList.add('eva-loader__bar--indeterminate');i.style.removeProperty('--eva-progress');}
});
</script>
